<svg xmlns="http://www.w3.org/2000/svg" width="168" height="52" viewBox="0 0 168 52" role="img" aria-label="View my CV"><title>View my CV</title><style>@font-face{font-family:'jv-m7';src:url(data:font/woff;base64,) format('woff');font-weight:700}.m7{font-family:'jv-m7',Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:700}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
.blink{animation:blink 1.1s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes flow{to{stroke-dashoffset:-20}}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.8);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="167" height="51" rx="12" fill="#1a1918" stroke="#302e2d"/><g transform="translate(22,19.5)"><path d="M1 0 H9 L14 5 V17 H1 Z M9 0 V5 H14 M4.5 9.5 H10.5 M4.5 13 H10.5" fill="none" stroke="#ff6a32" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,-2)"/></g><text x="51" y="32" class="m7" font-size="17" fill="#f1f0f0">View my CV</text></svg>