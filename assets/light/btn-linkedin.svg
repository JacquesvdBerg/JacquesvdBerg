<svg xmlns="http://www.w3.org/2000/svg" width="143" height="52" viewBox="0 0 143 52" role="img" aria-label="LinkedIn"><title>LinkedIn</title><style>@font-face{font-family:'jv-m7';src:url(data:font/woff;base64,) format('woff');font-weight:700}.m7{font-family:'jv-m7',Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:700}@font-face{font-family:'jv-m8';src:url(data:font/woff;base64,) format('woff');font-weight:800}.m8{font-family:'jv-m8',Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:800}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
.blink{animation:blink 1.1s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes flow{to{stroke-dashoffset:-20}}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.8);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
