<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Everything I build lives at vanneberg.co.za. Projects, build journals and my CV."><title>Everything I build lives at vanneberg.co.za. Projects, build journals and my CV.</title><style>@font-face{font-family:'jv-m5';src:url(data:font/woff;base64,) format('woff');font-weight:500}.m5{font-family:'jv-m5',Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500}@font-face{font-family:'jv-m6';src:url(data:font/woff;base64,) format('woff');font-weight:600}.m6{font-family:'jv-m6',Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600}@font-face{font-family:'jv-m8';src:url(data:font/woff;base64,) format('woff');font-weight:800}.m8{font-family:'jv-m8',Manrope, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:800}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
.blink{animation:blink 1.1s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes flow{to{stroke-dashoffset:-20}}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.8);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#e6dfda"/></pattern><radialGradient id="fade" cx="85%" cy="40%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask><radialGradient id="glow"><stop offset="0" stop-color="#ff6a32" stop-opacity="0.1"/><stop offset="1" stop-color="#ff6a32" stop-opacity="0"/></radialGradient></defs><rect x=".5" y=".5" width="1199" height="299" rx="24" fill="#faf8f6" stroke="#e4ded9"/><g clip-path="url(#frame)"><rect width="1200" height="300" fill="url(#dots)" mask="url(#dotmask)"/><circle cx="1060" cy="150" r="360" fill="url(#glow)"/></g><text x="56" y="92" class="m6" font-size="24" fill="#6b635e">Everything I build lives at</text><text x="52" y="168" class="m8" font-size="72" fill="#171514" letter-spacing="-2.5">vanneberg.co.za<tspan class="blink" fill="#ff6a32">_</tspan></text><text x="56" y="222" class="m5" font-size="20" fill="#6b635e">Projects, build journals and my CV. For opportunities or a good</text><text x="56" y="250" class="m5" font-size="20" fill="#6b635e">technical conversation, email jacques@visionlink.co.za.</text><circle cx="1052" cy="150" r="58" fill="#ff6a32"/><g transform="translate(1038,136) scale(2.3)"><path d="M0 12 L12 0 M3 0 H12 V9" fill="none" stroke="#111010" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>